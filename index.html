<meta name="application-name" content="WRO LIVE">
<meta name="theme-color" content="#170668">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WRO LIVE">
<style>
  :root{
    color-scheme:light;
    --ink:#170668; --paper:#F7F7FB; --line:#E3E1ED; --muted:#685D9D;
    --gold:#E19C0B; --blue:#056ACB; --violet:#5A09BD; --magenta:#C50490;
    --green:#2A8A4A; --red:#D23B3B;
    --home:var(--blue); --away:var(--magenta);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    font-size:18px;line-height:1.35;font-weight:400}
  body{padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:10px 14px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px}
  .logo{height:26px;width:auto;display:block;opacity:.85}
  .tag{font-weight:700;font-size:14px;color:var(--muted);text-align:right}
  button,input,select{font:inherit}
  button{touch-action:manipulation}
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

  .card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  h2{font-size:17px;margin:20px 0 8px;font-weight:700}
  .card h2{margin-top:0}
  h2 small{font-weight:400;color:var(--muted);font-size:14px}
  label.f{display:block;font-size:15px;color:var(--muted);font-weight:700;margin-bottom:12px}
  select,input[type=text],input[type=number]{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;
    padding:12px;background:#fff;color:var(--ink);font-weight:700;font-size:18px}
  .warn{color:var(--red);font-weight:700;margin:0 0 10px;min-height:1.2em}
  details.teams{margin-top:14px}
  details.teams summary{cursor:pointer;font-weight:700;color:var(--violet);padding:6px 0}
  details.teams label{margin:10px 0 0}
  .opt{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px;color:var(--muted)}
  .opt input{width:22px;height:22px;accent-color:var(--violet);margin:0}

  .btn{border:0;border-radius:12px;padding:15px 16px;cursor:pointer;background:var(--ink);color:#fff;font-weight:700;
    flex:1 1 auto;min-height:54px}
  .btn.big{width:100%;font-size:20px;min-height:62px;background:var(--green)}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .btn.danger{background:#fff;color:var(--red);border:2px solid #F0C4C4}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:active:not(:disabled){transform:scale(.98)}
  .ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

  .board{background:var(--ink);color:#fff;border-radius:14px;padding:16px 12px 14px}
  .board-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
  .team{font-weight:700;font-size:17px;overflow-wrap:anywhere}
  .team i{display:block;height:5px;border-radius:3px;margin:7px auto 0;width:48px}
  .score{font-size:50px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1}
  .meta{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;color:#CFCBEE;font-size:15px}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;color:#fff;font-size:20px}
  button.clock{background:transparent;border:0;padding:4px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
  button.clock:not(:disabled)::after{content:" ✎";font-size:14px;color:#CFCBEE;font-weight:400}
  button.clock:disabled{cursor:default}
  .badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:#3A2C84;color:#E1DEF7}
  .badge.live{background:var(--magenta);color:#fff}

  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .col{background:#fff;border:1px solid var(--line);border-top-width:7px;border-radius:14px;padding:10px;display:grid;gap:10px;align-content:start}
  .col.h{border-top-color:var(--home)}
  .col.a{border-top-color:var(--away)}
  .col-name{font-weight:700;font-size:17px;text-align:center;overflow-wrap:anywhere}
  .ev{border:0;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;padding:14px 6px;font-size:18px;min-height:56px}
  .ev.goal{background:var(--green);font-size:22px;min-height:76px}
  .ev.yellow{background:var(--gold);color:var(--ink)}
  .ev.red{background:var(--red)}
  .ev:disabled{opacity:.35;cursor:not-allowed}
  .ev:active:not(:disabled){transform:scale(.98)}

  ol.tl{list-style:none;margin:0;padding:0}
  ol.tl li{border-bottom:1px solid var(--line)}
  ol.tl li:last-child{border-bottom:0}
  ol.tl button{width:100%;display:grid;grid-template-columns:58px 30px 1fr;gap:6px;align-items:center;text-align:left;
    background:transparent;border:0;padding:12px 2px;cursor:pointer;color:var(--ink)}
  .min{font-weight:700;font-variant-numeric:tabular-nums}
  .what{font-weight:700}
  .what small{display:block;font-weight:400;color:var(--muted);font-size:15px}
  .noname{font-style:italic;color:var(--violet)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .empty{color:var(--muted);padding:6px 2px}
  .foot{font-size:13px;color:var(--muted);margin-top:22px;text-align:center}

  .sheet{position:fixed;inset:0;background:rgba(27,23,64,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet[hidden]{display:none}
  .sheet-card{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .sheet-title{font-size:20px;font-weight:700}
  .sheet-title small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
  .x{border:0;background:#ECEAF6;border-radius:10px;width:44px;height:44px;font-size:22px;cursor:pointer;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--ink)}
  a.btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
  .pub textarea{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);
    font-family:inherit;font-size:16px;font-weight:400;line-height:1.4;resize:vertical;min-height:140px}
  .pubmsg{margin-top:10px;font-weight:700;font-size:15px;min-height:1.2em}
  .warnbar{background:#FFF3D6;color:#7A5200;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px;font-weight:700}
  .warnbar[hidden]{display:none}
  details.diag{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
  details.diag div{margin-top:6px;line-height:1.5}
  #askText{white-space:pre-line}
  .pub{margin-top:12px;border-radius:12px;padding:12px 14px;font-weight:700;background:#FFF3D6;color:#7A5200}
  .pub.ok{background:#E3F4EA;color:#17613A}
  .pub.err{background:#FCE5E5;color:#9A2A2A}
  .pub .ctrl{margin-top:10px}
  .pub .btn{min-height:46px;padding:10px 14px}
  .timegrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-top:12px}
  .timegrid .colon{font-size:26px;font-weight:700;padding-bottom:10px}
  .swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin:8px 0 16px}
  .sw{position:relative;display:block;width:100%;height:0;padding:0 0 100% 0;border-radius:50%;border:0;box-shadow:0 0 0 1px #B9B6D3;
    cursor:pointer;min-width:0;-webkit-appearance:none;appearance:none;overflow:visible}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--violet)}
  .sw[aria-pressed="true"]::after{content:"✓";position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;line-height:1;color:inherit}
  .kinds.two{grid-template-columns:1fr 1fr}
  .hint{font-size:14px;color:var(--muted);margin:8px 2px 14px}
  .sides{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-weight:700;font-size:15px;color:var(--muted)}
  .sides .btn{flex:0 0 auto;min-height:44px;padding:8px 14px;font-size:16px}
  .hintline{flex:1 1 100%;font-size:14px;color:var(--muted);margin:0}
  .kitdot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:-1px}
  .kitdot.light,.dot.light{box-shadow:0 0 0 1px #8F8CAD}
  .col-name small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
  .col{border-top-color:var(--kit,#999)}
  .col.light{border-top-color:#BDBAD3}
  .kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kinds[hidden]{display:none}
  .kind{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 4px;font-weight:700;cursor:pointer;color:var(--ink)}
  .kind[aria-pressed="true"]{border-color:var(--violet);background:#EFEAFB;color:var(--violet)}
</style>

<script>
/* ===================== połączenie z główną stroną =====================
   Uzupełnij, gdy backend (np. Supabase) będzie gotowy:
   url     – adres, pod który panel wysyła podsumowanie meczu (POST, JSON)
   headers – nagłówki wymagane przez backend (np. klucz API)
   Dopóki url jest pusty, podsumowanie nie jest nigdzie wysyłane. */
const PUBLISH = {
  url: '',
  headers: {}
};

/* ===================== stan i zapis ===================== */
const KEY = 'wroaktyw-live-v1';
const TYPES = {
  goal:   {label:'Gol',             icon:'⚽', cls:'goal'},
  yellow: {label:'Żółta kartka',    icon:'🟨', cls:'yellow'},
  red:    {label:'Czerwona kartka', icon:'🟥', cls:'red'}
};
const defState = () => ({
  known:[], kits:{}, draft:{h:'',a:'',hc:'#056ACB',ac:'#D32F2F',side:0}, players:{}, fast:false, match:null
});
let S;
try { S = Object.assign(defState(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ S = defState(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===================== zegar ===================== */
function clockSec(){
  const m = S.match; if(!m) return 0;
  let s = m.base;
  if(m.status === 'running') s += Math.floor((Date.now() - m.since) / 1000 * (S.fast ? 30 : 1));
  return s;
}
function commit(){ const m = S.match; if(m && m.status==='running'){ m.base = clockSec(); m.since = Date.now(); } }
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
function minLabel(min, half){
  if(half===1 && min>45) return '45+' + (min-45) + "'";
  if(half===2 && min>90) return '90+' + (min-90) + "'";
  return min + "'";
}
const STATUS = {before:'Przed meczem', running:'LIVE', paused:'Pauza', halftime:'Przerwa', finished:'Koniec meczu'};

/* ===================== pomocnicze ===================== */
const score = () => {
  const r = [0,0];
  (S.match ? S.match.events : []).forEach(e => { if(e.type==='goal') r[e.team]++; });
  return r;
};
const buzz = () => { try { navigator.vibrate && navigator.vibrate(30); } catch(e){} };
const PALETTE = [['Czerwony','#D32F2F'],['Bordowy','#7B1E3A'],['Pomarańczowy','#F57C00'],['Żółty','#FBC02D'],['Zielony','#2E7D32'],
  ['Turkusowy','#00897B'],['Błękitny','#4FC3F7'],['Niebieski','#056ACB'],['Granatowy','#1A237E'],['Fioletowy','#6A1B9A'],
  ['Różowy','#C50490'],['Czarny','#212121'],['Szary','#9E9E9E'],['Biały','#FFFFFF']];
const DEF_KITS = ['#056ACB', '#D32F2F'];
const kit = i => (S.match && S.match.colors && S.match.colors[i]) || DEF_KITS[i];
const lum = hex => { const n = parseInt(String(hex).slice(1), 16); return 0.299*((n >> 16) & 255) + 0.587*((n >> 8) & 255) + 0.114*(n & 255); };
const isLight = hex => lum(hex) > 200;
const kitName = hex => { const f = PALETTE.find(x => x[1] === hex); return f ? f[0] : ''; };
const pkey = teamName => String(teamName || '').trim().toLowerCase();
// zawodnik, który strzelił gola samobójczego, jest z drużyny przeciwnej niż ta, której gol zaliczono
const playerTeam = e => (e.type==='goal' && e.kind==='own') ? 1 - e.team : e.team;
function evLabel(e){
  if(e.type==='goal') return e.kind==='pen' ? 'Gol z karnego' : e.kind==='own' ? 'Gol samobójczy' : 'Gol';
  return TYPES[e.type].label;
}
function rememberPlayer(teamName, name){
  if(!name) return;
  const key = pkey(teamName);
  const list = (S.players[key] || []).filter(n => n.toLowerCase() !== name.toLowerCase());
  list.unshift(name);
  S.players[key] = list.slice(0, 30);
}
function rememberTeam(name){
  name = String(name || '').trim(); if(!name) return;
  S.known = [name].concat((S.known || []).filter(n => n.toLowerCase() !== name.toLowerCase())).slice(0, 60);
}

/* wake lock: ekran nie gaśnie w trakcie meczu */
let wl = null;
async function wakeLock(){
  try {
    if(S.match && S.match.status==='running' && 'wakeLock' in navigator && !wl){
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') wakeLock(); });

/* ===================== akcje meczu ===================== */
const newId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function startMatch(){
  const h = S.draft.h.trim(), a = S.draft.a.trim();
  if(!h || !a || h.toLowerCase() === a.toLowerCase()) return;
  const hc = S.draft.hc || DEF_KITS[0], ac = S.draft.ac || DEF_KITS[1], side = S.draft.side === 1 ? 1 : 0;
  rememberTeam(a); rememberTeam(h);
  S.kits = S.kits || {}; S.kits[pkey(h)] = hc; S.kits[pkey(a)] = ac;
  S.match = {
    id:newId(), names:[h, a], colors:[hc, ac], sides:side,
    status:'before', half:1, base:0, since:null, events:[], nextId:1
  };
  S.draft = {h:'', a:'', hc:DEF_KITS[0], ac:DEF_KITS[1], side:side};
  save(); render();
}
function kickoff(){
  const m = S.match; if(!m || m.status !== 'before') return;
  m.status = 'running'; m.half = 1; m.base = 0; m.since = Date.now();
  save(); render(); wakeLock();
}
function backToSetup(){
  const m = S.match; if(!m || m.status !== 'before') return;
  S.draft = {h:m.names[0], a:m.names[1], hc:(m.colors||DEF_KITS)[0], ac:(m.colors||DEF_KITS)[1], side:m.sides === 1 ? 1 : 0};
  S.match = null; save(); render();
}
function setStatus(st){
  const m = S.match;
  if(st==='paused' || st==='halftime' || st==='finished'){ m.base = clockSec(); m.since = null; }
  if(st==='running'){ m.since = Date.now(); }
  m.status = st; save(); render(); wakeLock();
}
function secondHalf(){
  const m = S.match; m.half = 2; m.base = 45*60; m.since = Date.now(); m.status = 'running';
  m.sides = m.sides === 1 ? 0 : 1; // drużyny zamieniają się stronami
  save(); render(); wakeLock();
}
function addEvent(type, team){
  const m = S.match;
  if(m.status!=='running' && m.status!=='paused') return;
  const ev = {id:m.nextId++, type, team, half:m.half, min:Math.floor(clockSec()/60)+1, name:'', kind:'normal'};
  m.events.push(ev);
  buzz(); save(); renderBoard(); renderTimeline(); openSheet(ev.id, true);
}

/* ===================== okno zdarzenia ===================== */
let sheetId = null, sheetKind = 'normal', sheetNew = false;
const KINDS = [['normal','Zwykły'],['pen','Karny'],['own','Samobójczy']];
function drawSheet(ev){
  const m = S.match, t = TYPES[ev.type], isGoal = ev.type === 'goal';
  const label = isGoal ? (sheetKind==='pen' ? 'Gol z karnego' : sheetKind==='own' ? 'Gol samobójczy' : 'Gol') : t.label;
  let sub = esc(m.names[ev.team]);
  if(isGoal && sheetKind==='own') sub = `gol dla: ${esc(m.names[ev.team])}<br>strzelił zawodnik: ${esc(m.names[1-ev.team])}`;
  if(sheetNew) sub += ' · dodano';
  $('sTitle').innerHTML = `${t.icon} ${label}<small>${sub}</small>`;
  $('sKind').hidden = !isGoal;
  $('sKind').innerHTML = isGoal ? KINDS.map(([k,l]) => `<button type="button" class="kind" aria-pressed="${k===sheetKind}" data-k="${k}">${l}</button>`).join('') : '';
  $('sKind').querySelectorAll('.kind').forEach(b => b.onclick = () => { sheetKind = b.dataset.k; drawSheet(ev); });
  const pt = (isGoal && sheetKind==='own') ? 1 - ev.team : ev.team;
  const list = (S.players[pkey(m.names[pt])] || []).slice(0, 12);
  $('sChips').innerHTML = list.map(n => `<button type="button" class="chip">${esc(n)}</button>`).join('');
  $('sChips').querySelectorAll('.chip').forEach(b => b.onclick = () => { $('sName').value = b.textContent; });
}
function openSheet(id, isNew){
  const m = S.match, ev = m.events.find(e => e.id === id); if(!ev) return;
  sheetId = id; sheetNew = !!isNew; sheetKind = ev.kind || 'normal';
  $('sName').value = ev.name || '';
  $('sMin').value = ev.min;
  drawSheet(ev);
  $('sheet').hidden = false;
  setTimeout(() => $('sName').focus(), 50);
}
function closeSheet(){ $('sheet').hidden = true; sheetId = null; }
$('sClose').onclick = closeSheet;
$('sheet').addEventListener('click', e => { if(e.target === $('sheet')) closeSheet(); });
$('sSave').onclick = () => {
  const m = S.match, ev = m.events.find(e => e.id === sheetId); if(!ev) return closeSheet();
  ev.name = $('sName').value.trim();
  if(ev.type === 'goal') ev.kind = sheetKind;
  const v = parseInt($('sMin').value, 10);
  if(!isNaN(v)) ev.min = Math.max(1, Math.min(130, v));
  rememberPlayer(m.names[playerTeam(ev)], ev.name);
  save(); closeSheet(); renderBoard(); renderTimeline(); renderPub();
};
$('sDel').onclick = () => {
  const m = S.match;
  m.events = m.events.filter(e => e.id !== sheetId);
  save(); closeSheet(); renderBoard(); renderTimeline(); renderPub();
};

/* ===================== potwierdzenie ===================== */
let pendingAsk = null;
function askConfirm(text, yesLabel, fn){
  $('askText').textContent = text; $('askYes').textContent = yesLabel;
  pendingAsk = fn; $('ask').hidden = false;
}
$('askNo').onclick = () => { $('ask').hidden = true; pendingAsk = null; };
$('askYes').onclick = () => { const f = pendingAsk; $('ask').hidden = true; pendingAsk = null; if(f) f(); };

/* ===================== edycja czasu ===================== */
function openTime(){
  const m = S.match; if(!m || m.status === 'finished' || m.status === 'before') return;
  const s = clockSec();
  $('tMin').value = Math.floor(s/60); $('tSec').value = s % 60;
  $('tsheet').hidden = false;
}
const closeTime = () => { $('tsheet').hidden = true; };
$('tClose').onclick = closeTime;
$('tsheet').addEventListener('click', e => { if(e.target === $('tsheet')) closeTime(); });
function readTime(){ return (parseInt($('tMin').value,10)||0)*60 + Math.min(59, Math.max(0, parseInt($('tSec').value,10)||0)); }
function adjTime(d){ const s = Math.max(0, readTime() + d); $('tMin').value = Math.floor(s/60); $('tSec').value = s % 60; }
$('tMinus').onclick = () => adjTime(-60);
$('tPlus').onclick = () => adjTime(60);
$('tSave').onclick = () => {
  const m = S.match; if(!m) return closeTime();
  m.base = Math.max(0, Math.min(150*60, readTime()));
  if(m.status === 'running') m.since = Date.now();
  save(); closeTime(); renderBoard();
};

/* ===================== podsumowanie -> Aktualności ===================== */
const ICON = {goal:'⚽', yellow:'🟨', red:'🟥'};
const sortedEvents = () => S.match.events.slice().sort((a,b) => (a.half-b.half) || (a.min-b.min) || (a.id-b.id));
function postBody(){
  const m = S.match, sc = score();
  const lines = [`Koniec meczu: ${m.names[0]} ${sc[0]}:${sc[1]} ${m.names[1]}`, ''];
  sortedEvents().forEach(e => {
    const own = e.type==='goal' && e.kind==='own';
    const who = e.name ? ' – ' + e.name : '';
    const team = own ? `${m.names[1-e.team]}, gol dla ${m.names[e.team]}` : m.names[e.team];
    lines.push(`${ICON[e.type]} ${minLabel(e.min, e.half)} ${evLabel(e)}${who} (${team})`);
  });
  if(!m.events.length) lines.push('Bez goli i kartek.');
  return lines.join('\n');
}
function buildPost(){
  const m = S.match, sc = score();
  return {
    id:m.id, type:'mecz',
    title:`${m.names[0]} ${sc[0]}:${sc[1]} ${m.names[1]}`,
    body:postBody(),
    home:m.names[0], away:m.names[1], home_color:kit(0), away_color:kit(1), home_goals:sc[0], away_goals:sc[1],
    events:sortedEvents().map(e => ({minute:minLabel(e.min, e.half), type:e.type, kind:e.kind || null, player:e.name || null, team:m.names[e.team]})),
    finished_at:new Date().toISOString()
  };
}
function txtFile(){
  const m = S.match, sc = score(), d = new Date();
  const slug = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L')
    .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const text = ['WROAKTYW LIVE – podsumowanie meczu', 'Data: ' + d.toLocaleDateString('pl-PL'), '', postBody(), ''].join('\n');
  return {name:`Wroaktyw_${slug(m.names[0])}_${sc[0]}-${sc[1]}_${slug(m.names[1])}_${iso}.txt`, text};
}
function downloadTxt(){
  try {
    const f = txtFile();
    const blob = new Blob(['\ufeff' + f.text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){}
}
let dlUrl = null;
function msg(t){ const e = $('pubMsg'); if(e) e.textContent = t; }
async function shareTxt(){
  const f = txtFile(), title = S.match.names[0] + ' – ' + S.match.names[1];
  msg('');
  if(!navigator.share){
    msg('Udostępnianie nie działa w tej przeglądarce. Użyj „Pobierz plik TXT”, „Kopiuj tekst” albo WhatsApp.');
    return;
  }
  let lastErr = null;
  try {
    let file = null;
    try { file = new File([f.text], f.name, {type:'text/plain'}); } catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title}); msg('Udostępniono ✓'); return; }
  } catch(e){ if(e && e.name === 'AbortError') return; lastErr = e; }
  try { await navigator.share({title, text:f.text}); msg('Udostępniono ✓'); return; }
  catch(e){ if(e && e.name === 'AbortError') return; lastErr = e; }
  msg('Udostępnianie jest zablokowane w tym oknie (' + ((lastErr && lastErr.name) || 'błąd') + '). Użyj „Pobierz plik TXT”, „Kopiuj tekst” albo WhatsApp.');
}
function setPub(id, state, msg){
  if(!S.match || S.match.id !== id) return;
  S.match.pub = {state, msg:msg || '', at:Date.now()};
  save(); renderPub();
}
async function publishSummary(){
  const m = S.match; if(!m) return;
  if(!m.id) m.id = newId();
  const id = m.id;
  if(!PUBLISH.url){ setPub(id, 'file'); downloadTxt(); return; }
  setPub(id, 'sending');
  let to;
  try{
    const ctl = new AbortController(); to = setTimeout(() => ctl.abort(), 15000);
    const res = await fetch(PUBLISH.url, {
      method:'POST', headers:Object.assign({'Content-Type':'application/json'}, PUBLISH.headers),
      body:JSON.stringify(buildPost()), signal:ctl.signal
    });
    clearTimeout(to);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    setPub(id, 'sent');
  } catch(e){
    clearTimeout(to);
    setPub(id, navigator.onLine === false ? 'offline' : 'error', String(e && e.message || e));
  }
}
function renderPub(){
  const box = $('pub'); if(!box) return;
  const m = S.match;
  if(!m || m.status !== 'finished'){ box.innerHTML = ''; return; }
  const p = m.pub || {state:'none'};
  let cls = '', txt = '', retry = '', copy = false;
  if(p.state === 'sending') txt = 'Wysyłanie podsumowania…';
  else if(p.state === 'sent'){ cls = 'ok'; txt = 'Podsumowanie wysłane do Aktualności ✓'; retry = 'Wyślij ponownie (zaktualizuj)'; }
  else if(p.state === 'offline'){ txt = 'Brak połączenia. Podsumowanie wyśle się samo, gdy wróci internet.'; retry = 'Wyślij teraz'; copy = true; }
  else if(p.state === 'error'){ cls = 'err'; txt = 'Nie udało się wysłać podsumowania.'; retry = 'Spróbuj ponownie'; copy = true; }
  else if(p.state === 'file'){ cls = 'ok'; txt = 'Podsumowanie gotowe ✓'; }
  else { retry = PUBLISH.url ? 'Wyślij podsumowanie' : 'Zapisz podsumowanie (TXT)'; }
  let html = `<div class="pub ${cls}" role="status">${txt}`;
  if(p.state === 'file'){
    const f = txtFile();
    if(dlUrl){ try { URL.revokeObjectURL(dlUrl); } catch(e){} dlUrl = null; }
    let href = '';
    try { dlUrl = URL.createObjectURL(new Blob(['\ufeff' + f.text], {type:'text/plain;charset=utf-8'})); href = dlUrl; }
    catch(e){ href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(f.text); }
    html += `<div style="font-weight:400;font-size:15px;margin-top:4px">Plik TXT próbował pobrać się sam. Jeśli go nie widzisz, użyj przycisków poniżej albo skopiuj tekst z pola.</div>
      <textarea id="sumText" readonly rows="8" aria-label="Treść podsumowania">${esc(f.text)}</textarea>
      <div class="ctrl"><a class="btn" id="dl" href="${href}" download="${esc(f.name)}">Pobierz plik TXT</a><button class="btn ghost" id="pubShare">Udostępnij</button></div>
      <div class="ctrl"><button class="btn ghost" id="copy">Kopiuj tekst</button><a class="btn ghost" id="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(f.text)}">WhatsApp</a></div>`;
  } else if(retry || copy){
    html += `<div class="ctrl">${retry ? `<button class="btn" id="pubRetry">${retry}</button>` : ''}${copy ? `<button class="btn ghost" id="copy">Kopiuj tekst</button>` : ''}</div>`;
  }
  html += `<div class="pubmsg" id="pubMsg" role="status"></div></div>`;
  box.innerHTML = html;
  if($('pubRetry')) $('pubRetry').onclick = publishSummary;
  if($('pubShare')) $('pubShare').onclick = shareTxt;
  if($('copy')) $('copy').onclick = copyReport;
  if($('dl')) $('dl').onclick = () => msg('Pobieranie uruchomione. Szukaj pliku w folderze Pobrane. Jeśli go nie ma, przeglądarka blokuje pobieranie: użyj „Kopiuj tekst” lub WhatsApp.');
}
const plZd = n => n===1 ? 'zdarzenie' : ((n%10>=2 && n%10<=4 && !(n%100>=12 && n%100<=14)) ? 'zdarzenia' : 'zdarzeń');
function retryPending(){
  const m = S.match;
  if(m && m.status === 'finished' && m.pub && (m.pub.state === 'offline' || m.pub.state === 'error') && PUBLISH.url) publishSummary();
}
if(typeof window !== 'undefined' && window.addEventListener) window.addEventListener('online', retryPending);

/* ===================== widoki ===================== */
let setupCheck = () => {};
function setKit(t, c){
  S.draft = Object.assign({}, S.draft, t === 'h' ? {hc:c} : {ac:c}); save();
  document.querySelectorAll('.sw[data-t="' + t + '"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.c === c)));
  const nm = $(t === 'h' ? 'kitNameH' : 'kitNameA'); if(nm) nm.textContent = kitName(c);
  setupCheck();
}
function setSide(v){
  S.draft = Object.assign({}, S.draft, {side:v}); save();
  document.querySelectorAll('#sidePick .kind').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.s === v)));
}
function applyKnownKit(t, name){
  const c = (S.kits || {})[pkey(name)];
  const cur = t === 'h' ? S.draft.hc : S.draft.ac;
  if(c && c !== cur) setKit(t, c);
}
function setupView(){
  const known = S.known || [];
  const d = Object.assign({h:'', a:'', hc:DEF_KITS[0], ac:DEF_KITS[1], side:0}, S.draft);
  const sw = t => PALETTE.map(([n, c]) =>
    `<button type="button" class="sw${isLight(c) ? ' light' : ''}" data-t="${t}" data-c="${c}" style="background:${c};color:${lum(c) > 165 ? '#170668' : '#fff'}" aria-label="${n}" aria-pressed="${(t === 'h' ? d.hc : d.ac) === c}"></button>`).join('');
  $('app').innerHTML = `
    <section class="card">
      <h2>Nowy mecz</h2>
      <label class="f" style="margin-bottom:6px">Gospodarze<input type="text" id="inH" list="teamList" maxlength="40" autocomplete="off" autocapitalize="words" placeholder="Wpisz nazwę drużyny" value="${esc(d.h)}"></label>
      <div class="f" style="margin:0">Kolor stroju gospodarzy: <b id="kitNameH" style="color:var(--ink)">${kitName(d.hc)}</b></div>
      <div class="swatches" id="swH">${sw('h')}</div>
      <label class="f" style="margin-bottom:6px">Goście<input type="text" id="inA" list="teamList" maxlength="40" autocomplete="off" autocapitalize="words" placeholder="Wpisz nazwę drużyny" value="${esc(d.a)}"></label>
      <div class="f" style="margin:0">Kolor stroju gości: <b id="kitNameA" style="color:var(--ink)">${kitName(d.ac)}</b></div>
      <div class="swatches" id="swA">${sw('a')}</div>
      <datalist id="teamList">${known.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      ${known.length ? `<div class="f" style="margin-bottom:6px">Ostatnio używane</div><div class="chips" id="known">${known.slice(0, 8).map(n => `<button type="button" class="chip">${esc(n)}</button>`).join('')}</div>` : ''}
      <div class="f" style="margin:4px 0 6px">Strona boiska (patrząc z miejsca, w którym stoisz)</div>
      <div class="kinds two" id="sidePick">
        <button type="button" class="kind" data-s="0" aria-pressed="${d.side !== 1}">Gospodarze po lewej</button>
        <button type="button" class="kind" data-s="1" aria-pressed="${d.side === 1}">Gospodarze po prawej</button>
      </div>

      <p class="warn" id="warn"></p>
      <button class="btn big" id="start">Przejdź do panelu meczu</button>
      <label class="opt"><input type="checkbox" id="fast" ${S.fast ? 'checked' : ''}> Tryb testowy: zegar 30× szybciej</label>
    </section>`;
  let last = 'h';
  $('inH').onfocus = () => { last = 'h'; };
  $('inA').onfocus = () => { last = 'a'; };
  setupCheck = () => {
    const h = $('inH').value.trim(), a = $('inA').value.trim();
    const same = h && a && h.toLowerCase() === a.toLowerCase();
    const sameKit = S.draft.hc && S.draft.hc === S.draft.ac;
    $('warn').textContent = same ? 'Wpisz dwie różne drużyny.' : (sameKit ? 'Uwaga: oba stroje mają ten sam kolor.' : '');
    $('start').disabled = !h || !a || !!same;

  $('inA').oninput = () => { sync(); applyKnownKit('a', $('inA').value); };
  $('app').querySelectorAll('.sw').forEach(b => b.onclick = () => setKit(b.dataset.t, b.dataset.c));
  $('app').querySelectorAll('#sidePick .kind').forEach(b => b.onclick = () => setSide(+b.dataset.s));

  if(box) box.querySelectorAll('.chip').forEach(b => b.onclick = () => {

    sync(); applyKnownKit(target, name);

  $('fast').onchange = e => { S.fast = e.target.checked; save(); };
  $('start').onclick = startMatch;

  $('app').innerHTML = `

    <div class="ctrl" id="ctrl"></div>

    <div class="panel"><ol class="tl" id="tl"></ol></div>
    <div id="pub"></div>
    <div class="ctrl">
      <button class="btn ghost" id="newm">Nowy mecz</button>
    </div>
    <label class="opt"><input type="checkbox" id="fast" ${S.fast?'checked':''}> Tryb testowy: zegar 30× szybciej</label>`;
  $('duo').querySelectorAll('.ev').forEach(b => b.onclick = () => addEvent(b.dataset.k, +b.dataset.t));
  $('clock').onclick = openTime;
  $('swap').onclick = () => { m.sides = m.sides === 1 ? 0 : 1; save(); render(); };
  $('newm').onclick = () => askConfirm(
    (m.status === 'finished' && (!m.pub || (m.pub.state !== 'sent' && m.pub.state !== 'file')))
      ? 'Podsumowanie tego meczu NIE zostało wysłane ani zapisane. Na pewno usunąć mecz z panelu?'
      : 'Usunąć ten mecz z panelu?', 'Usuń mecz', () => {
    S.match = null; save(); render();
    try { wl && wl.release(); } catch(e){}
  });
  $('fast').onchange = e => { commit(); S.fast = e.target.checked; save(); };
  renderBoard(); renderCtrl(); renderTimeline(); renderPub();
}

function renderBoard(){
  const m = S.match; if(!m) return;
  const sc = score();
  $('n0').textContent = m.names[0]; $('n1').textContent = m.names[1];
  $('s0').textContent = sc[0]; $('s1').textContent = sc[1];
  $('clock').textContent = fmt(clockSec());
  $('clock').disabled = m.status === 'finished' || m.status === 'before';
  const b = $('status'); b.textContent = STATUS[m.status]; b.className = 'badge' + (m.status==='running' ? ' live' : '');
  const ok = m.status==='running' || m.status==='paused';
  document.querySelectorAll('#duo .ev').forEach(x => x.disabled = !ok);
}

function renderCtrl(){
  const m = S.match, c = $('ctrl');
  const b = (id, label, cls='') => `<button class="btn ${cls}" id="${id}">${label}</button>`;
  let h = '';
  if(m.status==='before') h = b('c-kick','Rozpocznij mecz','big') + b('c-back','Zmień drużyny','ghost');
  else if(m.status==='running') h = b('c-pause','Pauza','ghost') + (m.half===1 ? b('c-half','Koniec 1. połowy') : b('c-end','Koniec meczu'));
  else if(m.status==='paused') h = b('c-resume','Wznów') + (m.half===1 ? b('c-half','Koniec 1. połowy','ghost') : b('c-end','Koniec meczu','ghost')) + b('c-time','Edytuj czas','ghost');
  else if(m.status==='halftime') h = b('c-second','Rozpocznij 2. połowę') + '<p class="hintline">Po rozpoczęciu 2. połowy strony zamienią się automatycznie. Możesz to poprawić przyciskiem „Zamień strony”.</p>';
  else h = b('c-undoend','Cofnij koniec meczu','ghost');
  c.innerHTML = h;
  const on = (id, fn) => { const x = $(id); if(x) x.onclick = fn; };
  on('c-pause', () => setStatus('paused'));
  on('c-resume', () => setStatus('running'));
  on('c-half', () => setStatus('halftime'));
  on('c-second', secondHalf);
  on('c-kick', kickoff);
  on('c-back', backToSetup);
  on('c-time', openTime);
  on('c-end', () => {
    const sc = score(), miss = m.events.filter(e => !e.name).length;
    const online = !!PUBLISH.url;
    let txt = `Zakończyć mecz ${m.names[0]} ${sc[0]}:${sc[1]} ${m.names[1]} i ${online ? 'wysłać podsumowanie do Aktualności na stronie głównej WROAKTYW' : 'zapisać podsumowanie do pliku TXT'}?`;
    if(miss) txt += `\n\nUwaga: ${miss} ${plZd(miss)} bez nazwiska. Możesz anulować i je jeszcze dopisać.`;
    askConfirm(txt, online ? 'Zakończ i wyślij' : 'Zakończ i zapisz', () => { setStatus('finished'); publishSummary(); });
  });
  on('c-undoend', () => setStatus('paused'));
}

function renderTimeline(){
  const m = S.match; if(!m) return;
  const el = $('tl');
  if(!m.events.length){ el.innerHTML = '<li class="empty">Brak zdarzeń. Gol i kartki dodasz przyciskami powyżej.</li>'; return; }
  const list = m.events.slice().sort((a,b) => (b.half-a.half) || (b.min-a.min) || (b.id-a.id));
  el.innerHTML = list.map(e => {
    const t = TYPES[e.type], col = kit(e.team);
    const nm = e.name ? esc(e.name) : '<span class="noname">dopisz nazwisko</span>';
    const own = e.type==='goal' && e.kind==='own';
    const sub = own ? `gol dla ${esc(m.names[e.team])} · strzelił ${esc(m.names[1-e.team])}` : esc(m.names[e.team]);
    return `<li><button data-id="${e.id}"><span class="min">${minLabel(e.min, e.half)}</span><span aria-hidden="true">${t.icon}</span>
      <span class="what">${evLabel(e)} · ${nm}<small><span class="dot${isLight(col) ? ' light' : ''}" style="background:${col}"></span>${sub}</small></span></button></li>`;
  }).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => openSheet(+b.dataset.id, false));
}

/* ===================== kopiowanie ===================== */
async function copyReport(){
  const txt = txtFile().text;
  let ok = false, tmp = false, ta = $('sumText');
  if(!ta){ ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); tmp = true; }
  try { ta.focus(); ta.select(); if(ta.setSelectionRange) ta.setSelectionRange(0, 999999); ok = document.execCommand('copy'); } catch(e){}
  if(!ok){ try { await navigator.clipboard.writeText(txt); ok = true; } catch(e){} }
  if(tmp) ta.remove();
  msg(ok ? 'Skopiowano ✓' : 'Nie udało się skopiować automatycznie. Przytrzymaj tekst w polu powyżej, zaznacz go i skopiuj ręcznie.');
}

/* ===================== start ===================== */
const ENV = (() => {
  let storage = true, frame = false;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch(e){ storage = false; }
  try { frame = window.top !== window; } catch(e){ frame = true; }
  return {storage, frame};
})();
function renderEnv(){
  const warn = !ENV.storage || ENV.frame;
  $('envWarn').hidden = !warn;
  if(warn) $('envWarn').textContent = 'Uwaga: ' + (ENV.frame ? 'panel otwarto w ograniczonym podglądzie' : 'ta przeglądarka nie zapisuje danych') +
    '. Pobieranie pliku i udostępnianie mogą nie działać' + (!ENV.storage ? ', a mecz zniknie po odświeżeniu strony' : '') +
    '. Najlepiej otworzyć panel w Chrome (Android) lub Safari (iPhone) albo z hostingu.';
  const f = x => x ? 'tak' : 'nie';
  $('diagBox').innerHTML = [
    'Adres: ' + esc(String(location.protocol)),
    'Bezpieczny kontekst: ' + f(typeof window !== 'undefined' && window.isSecureContext),
    'Udostępnianie: ' + f(navigator.share), 'Schowek: ' + f(navigator.clipboard),
    'Pamięć danych: ' + f(ENV.storage), 'Podgląd w ramce: ' + f(ENV.frame)
  ].join('<br>');
}
function render(){ if(S.match) matchView(); else setupView(); }
render(); renderEnv();
setInterval(() => { if(S.match && S.match.status==='running' && $('clock')) $('clock').textContent = fmt(clockSec()); }, 500);
wakeLock();
retryPending();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
